version: '3'

vars:
  BASE_URL: http://localhost:3000/v1
  STATE: .demo-state

tasks:

  # ---------------------------------------------------------------------------
  # STATE MANAGEMENT
  # ---------------------------------------------------------------------------

  state:clear:
    desc: Clear all saved demo state (tokens, IDs)
    cmds:
      - rm -f {{.STATE}}
      - touch {{.STATE}}
      - echo "DEMO_ID=$(date +%s)" >> {{.STATE}}
      - echo "Demo state cleared."

  # ---------------------------------------------------------------------------
  # AUTH
  # ---------------------------------------------------------------------------

  auth:register:pet-owner:
    desc: Register a pet owner (saves PET_OWNER_TOKEN)
    vars:
      DEMO_ID:
        sh: grep '^DEMO_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        RESPONSE=$(curl -s -X POST {{.BASE_URL}}/auth/register \
          -H "Content-Type: application/json" \
          -d "{
            \"email\": \"owner.{{.DEMO_ID}}@example.com\",
            \"password\": \"password123\",
            \"firstName\": \"Alice\",
            \"lastName\": \"PetOwner\",
            \"role\": \"pet_owner\"
          }")
        echo "$RESPONSE" | jq .
        TOKEN=$(echo "$RESPONSE" | jq -r '.accessToken')
        grep -v "^PET_OWNER_TOKEN=" {{.STATE}} > {{.STATE}}.tmp 2>/dev/null || true
        echo "PET_OWNER_TOKEN=$TOKEN" >> {{.STATE}}.tmp
        mv {{.STATE}}.tmp {{.STATE}}

  auth:register:agent:
    desc: Register an insurance agent (saves AGENT_TOKEN)
    vars:
      DEMO_ID:
        sh: grep '^DEMO_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        RESPONSE=$(curl -s -X POST {{.BASE_URL}}/auth/register \
          -H "Content-Type: application/json" \
          -d "{
            \"email\": \"agent.{{.DEMO_ID}}@example.com\",
            \"password\": \"password123\",
            \"firstName\": \"Bob\",
            \"lastName\": \"Agent\",
            \"role\": \"agent\"
          }")
        echo "$RESPONSE" | jq .
        TOKEN=$(echo "$RESPONSE" | jq -r '.accessToken')
        grep -v "^AGENT_TOKEN=" {{.STATE}} > {{.STATE}}.tmp 2>/dev/null || true
        echo "AGENT_TOKEN=$TOKEN" >> {{.STATE}}.tmp
        mv {{.STATE}}.tmp {{.STATE}}

  auth:login:pet-owner:
    desc: Login as pet owner (saves PET_OWNER_TOKEN)
    vars:
      DEMO_ID:
        sh: grep '^DEMO_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        RESPONSE=$(curl -s -X POST {{.BASE_URL}}/auth/login \
          -H "Content-Type: application/json" \
          -d "{
            \"email\": \"owner.{{.DEMO_ID}}@example.com\",
            \"password\": \"password123\"
          }")
        echo "$RESPONSE" | jq .
        TOKEN=$(echo "$RESPONSE" | jq -r '.accessToken')
        grep -v "^PET_OWNER_TOKEN=" {{.STATE}} > {{.STATE}}.tmp 2>/dev/null || true
        echo "PET_OWNER_TOKEN=$TOKEN" >> {{.STATE}}.tmp
        mv {{.STATE}}.tmp {{.STATE}}

  auth:logout:
    desc: Logout (invalidate the pet owner session)
    vars:
      PET_OWNER_TOKEN:
        sh: grep '^PET_OWNER_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        curl -s -X POST {{.BASE_URL}}/auth/logout \
          -H "Authorization: Bearer {{.PET_OWNER_TOKEN}}"
        echo "Logged out."

  # ---------------------------------------------------------------------------
  # PETS
  # ---------------------------------------------------------------------------

  pets:list:
    desc: List all pets for the authenticated pet owner
    vars:
      PET_OWNER_TOKEN:
        sh: grep '^PET_OWNER_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        curl -s -X GET {{.BASE_URL}}/pets \
          -H "Authorization: Bearer {{.PET_OWNER_TOKEN}}" | jq .

  pets:register:
    desc: Register a pet (saves PET_ID)
    vars:
      DEMO_ID:
        sh: grep '^DEMO_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
      PET_OWNER_TOKEN:
        sh: grep '^PET_OWNER_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        RESPONSE=$(curl -s -X POST {{.BASE_URL}}/pets \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer {{.PET_OWNER_TOKEN}}" \
          -d "{
            \"name\": \"Buddy {{.DEMO_ID}}\",
            \"species\": \"dog\",
            \"breed\": \"Labrador\",
            \"dateOfBirth\": \"2020-03-15\"
          }")
        echo "$RESPONSE" | jq .
        PET_ID=$(echo "$RESPONSE" | jq -r '.id')
        grep -v "^PET_ID=" {{.STATE}} > {{.STATE}}.tmp 2>/dev/null || true
        echo "PET_ID=$PET_ID" >> {{.STATE}}.tmp
        mv {{.STATE}}.tmp {{.STATE}}

  pets:get:
    desc: Get the demo pet by ID
    vars:
      PET_OWNER_TOKEN:
        sh: grep '^PET_OWNER_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
      PET_ID:
        sh: grep '^PET_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        curl -s -X GET {{.BASE_URL}}/pets/{{.PET_ID}} \
          -H "Authorization: Bearer {{.PET_OWNER_TOKEN}}" | jq .

  pets:edit:
    desc: Edit the demo pet's breed
    vars:
      PET_OWNER_TOKEN:
        sh: grep '^PET_OWNER_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
      PET_ID:
        sh: grep '^PET_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        curl -s -X PATCH {{.BASE_URL}}/pets/{{.PET_ID}} \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer {{.PET_OWNER_TOKEN}}" \
          -d '{"breed": "Golden Retriever"}' | jq .

  pets:get:agent:
    desc: Get the demo pet as an agent (demonstrates agent read access)
    vars:
      AGENT_TOKEN:
        sh: grep '^AGENT_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
      PET_ID:
        sh: grep '^PET_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        curl -s -X GET {{.BASE_URL}}/pets/{{.PET_ID}} \
          -H "Authorization: Bearer {{.AGENT_TOKEN}}" | jq .

  # ---------------------------------------------------------------------------
  # CLAIMS
  # ---------------------------------------------------------------------------

  claims:submit:
    desc: Submit an insurance claim for the demo pet (saves CLAIM_ID)
    vars:
      DEMO_ID:
        sh: grep '^DEMO_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
      PET_OWNER_TOKEN:
        sh: grep '^PET_OWNER_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
      PET_ID:
        sh: grep '^PET_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        RESPONSE=$(curl -s -X POST {{.BASE_URL}}/claims \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer {{.PET_OWNER_TOKEN}}" \
          -d "{
            \"petId\": \"{{.PET_ID}}\",
            \"amount\": 250.00,
            \"description\": \"Routine check-up and vaccinations - demo {{.DEMO_ID}}\"
          }")
        echo "$RESPONSE" | jq .
        CLAIM_ID=$(echo "$RESPONSE" | jq -r '.id')
        grep -v "^CLAIM_ID=" {{.STATE}} > {{.STATE}}.tmp 2>/dev/null || true
        echo "CLAIM_ID=$CLAIM_ID" >> {{.STATE}}.tmp
        mv {{.STATE}}.tmp {{.STATE}}

  claims:list:pet-owner:
    desc: List claims as pet owner (sees only own claims)
    vars:
      PET_OWNER_TOKEN:
        sh: grep '^PET_OWNER_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        curl -s -X GET {{.BASE_URL}}/claims \
          -H "Authorization: Bearer {{.PET_OWNER_TOKEN}}" | jq .

  claims:list:agent:
    desc: List all claims as agent (sees all claims)
    vars:
      AGENT_TOKEN:
        sh: grep '^AGENT_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        curl -s -X GET {{.BASE_URL}}/claims \
          -H "Authorization: Bearer {{.AGENT_TOKEN}}" | jq .

  claims:get:
    desc: Get the demo claim by ID
    vars:
      AGENT_TOKEN:
        sh: grep '^AGENT_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
      CLAIM_ID:
        sh: grep '^CLAIM_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        curl -s -X GET {{.BASE_URL}}/claims/{{.CLAIM_ID}} \
          -H "Authorization: Bearer {{.AGENT_TOKEN}}" | jq .

  claims:approve:
    desc: Approve the demo claim as agent
    vars:
      AGENT_TOKEN:
        sh: grep '^AGENT_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
      CLAIM_ID:
        sh: grep '^CLAIM_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        curl -s -X POST {{.BASE_URL}}/claims/{{.CLAIM_ID}}/approve \
          -H "Authorization: Bearer {{.AGENT_TOKEN}}" | jq .

  claims:reject:
    desc: Reject the demo claim as agent
    vars:
      AGENT_TOKEN:
        sh: grep '^AGENT_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
      CLAIM_ID:
        sh: grep '^CLAIM_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        curl -s -X POST {{.BASE_URL}}/claims/{{.CLAIM_ID}}/reject \
          -H "Authorization: Bearer {{.AGENT_TOKEN}}" | jq .

  claims:submit:agent:
    desc: Attempt to submit a claim as agent (expects 403 Forbidden)
    vars:
      AGENT_TOKEN:
        sh: grep '^AGENT_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
      PET_ID:
        sh: grep '^PET_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        echo "Attempting to submit claim as agent (should be 403):"
        curl -s -X POST {{.BASE_URL}}/claims \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer {{.AGENT_TOKEN}}" \
          -d "{\"petId\": \"{{.PET_ID}}\", \"amount\": 100.00, \"description\": \"Forbidden\"}" | jq .

  # ---------------------------------------------------------------------------
  # DEMO WORKFLOW
  # ---------------------------------------------------------------------------

  demo:
    desc: Run the full end-to-end pet insurance demo workflow
    cmds:
      - task: state:clear
      - echo ""
      - echo "=== 1. Register pet owner and agent ==="
      - task: auth:register:pet-owner
      - task: auth:register:agent
      - echo ""
      - echo "=== 2. Pet owner registers a pet ==="
      - task: pets:register
      - echo ""
      - echo "=== 3. List pets (pet owner view) ==="
      - task: pets:list
      - echo ""
      - echo "=== 4. Agent views the pet ==="
      - task: pets:get:agent
      - echo ""
      - echo "=== 5. Pet owner submits a claim ==="
      - task: claims:submit
      - echo ""
      - echo "=== 6. Pet owner lists their claims ==="
      - task: claims:list:pet-owner
      - echo ""
      - echo "=== 7. Agent lists all claims ==="
      - task: claims:list:agent
      - echo ""
      - echo "=== 8. Agent approves the claim ==="
      - task: claims:approve
      - echo ""
      - echo "=== 9. Agent tries to submit a claim (expect 403) ==="
      - task: claims:submit:agent
      - echo ""
      - echo "=== Demo complete ==="
